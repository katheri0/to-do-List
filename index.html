<!DOCTYPE html>
<htmllang="en">

<head>
    <title>To-Do List</title>
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
 <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>

<body>
    <h1 class="text-center text-3xl font-semibold mb-4 ">To-Do List</h1>
    <div class="flex justify-center py-2">
        <textarea class=" px-2 py-2 border-gray-300 focus:outline-none focus:border-blue-500" id="message" cols="40" rows="1"></textarea>
        <br />
        <button id="add-note" class=" bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">Add Note</button>
    </div>
        <table class="w-6/12" id="todo-list">
        <thead class="">
            <tr class=" hover:bg-gray-100 odd:bg-white even:bg-gray-100">
                <th class="bg-gray-100">ID</th>
                <th class="bg-gray-100">Done</th>
                <th class="bg-gray-100">Task</th>
            </tr>

        </thead>
        <tbody id="todo-items"></tbody>
    </table>
    <script src="main.js">
      
    </script>
</body>

</html>
