<!DOCTYPE html>
<htmllang="en">

    <head>
        <title>To-Do List</title>
        <link rel="stylesheet" href="main.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css"
            integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
        <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    </head>

    <body>
        <h1 class="text-center text-3xl font-semibold mb-4 ">To-Do List</h1>
        <div class="flex justify-center gap-4 py-4">
            <textarea id="message" class="border border-gray-300 rounded p-2 w-1/2 focus:ring focus:ring-blue-300 max-w-md w-full" rows="1"></textarea>

            <button id="add-note"
                class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-2 rounded flex-shrink-0">
                Add Note
            </button>
        </div>


        <table class="w-6/12 mx-auto border border-gray-300 rounded-lg overflow-hidden shadow-sm" id="todo-list">
            <thead class="">
                <tr class="hover:bg-gray-50 even:bg-gray-100">
                    <th class="bg-gray-100">ID</th>
                    <th class="bg-gray-100">Done</th>
                    <th class="bg-gray-100">Task</th>
                </tr>

            </thead>
            <tbody id="todo-items"></tbody>
        </table>
        <script src="main.js">

        </script>
    </body>

    </html>
